name: Deploy Writer

on:
  workflow_dispatch:
    inputs:
      target:
        description: Legacy production backport only
        required: true
        type: choice
        options:
          - production
      expected_sha:
        description: Exact 40-hex merged release/legacy-query HEAD
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require exact legacy production release HEAD
        env:
          TARGET: ${{ inputs.target }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$TARGET" == production ]]
          [[ "$GITHUB_REF" == refs/heads/release/legacy-query ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Writer to ${{ inputs.target }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-writer-${{ inputs.target }}
      cancel-in-progress: false
    environment:
      name: writer-${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://writer.mdbase.dev/' || 'https://staging.mdbase-writer.pages.dev/' }}
    env:
      MDBASE_ENV: ${{ inputs.target }}
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The writer-${MDBASE_ENV} environment needs CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh checkout: retain deploy-pages.mjs's clean-tree guard, never bypass it.
      - run: node scripts/deploy-pages.mjs
        working-directory: apps/writer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_MDBASE_FEEDBACK_URL: ${{ vars.MDBASE_FEEDBACK_URL }}
          VITE_MDBASE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ vars.MDBASE_FEEDBACK_TURNSTILE_SITE_KEY }}
      - name: Verify deployed manifest
        env:
          ORIGIN: ${{ inputs.target == 'production' && 'https://writer.mdbase.dev' || 'https://staging.mdbase-writer.pages.dev' }}
        run: |
          for attempt in {1..12}; do
            homepage=$(curl --max-time 15 -fsS "$ORIGIN/.well-known/mdbase-app.json" | jq -r .homepage || true)
            if [ "$homepage" = "$ORIGIN/" ]; then
              echo "Manifest at $ORIGIN declares $homepage"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$ORIGIN/.well-known/mdbase-app.json does not declare $ORIGIN/"
          exit 1
