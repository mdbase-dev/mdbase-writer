name: Deploy Writer

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (validate staging before production)
        required: true
        type: choice
        options:
          - staging
          - production
      source_sha:
        description: Native path only — exact 40-hex HEAD of the target release/native-* branch; blank preserves the main path
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    if: inputs.source_sha == ''
    uses: ./.github/workflows/ci.yml

  deploy:
    if: inputs.source_sha == ''
    name: Deploy Writer to ${{ inputs.target }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-writer-${{ inputs.target }}
      cancel-in-progress: false
    environment:
      name: writer-${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://writer.mdbase.dev/' || 'https://staging.mdbase-writer.pages.dev/' }}
    env:
      MDBASE_ENV: ${{ inputs.target }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Staging and production deploy only from main (got ${GITHUB_REF})."
          exit 1
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The writer-${MDBASE_ENV} environment needs CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh checkout: retain deploy-pages.mjs's clean-tree guard, never bypass it.
      - run: node scripts/deploy-pages.mjs
        working-directory: apps/writer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_MDBASE_FEEDBACK_URL: ${{ vars.MDBASE_FEEDBACK_URL }}
          VITE_MDBASE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ vars.MDBASE_FEEDBACK_TURNSTILE_SITE_KEY }}
      - name: Verify deployed manifest
        env:
          ORIGIN: ${{ inputs.target == 'production' && 'https://writer.mdbase.dev' || 'https://staging.mdbase-writer.pages.dev' }}
        run: |
          for attempt in {1..12}; do
            homepage=$(curl --max-time 15 -fsS "$ORIGIN/.well-known/mdbase-app.json" | jq -r .homepage || true)
            if [ "$homepage" = "$ORIGIN/" ]; then
              echo "Manifest at $ORIGIN declares $homepage"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$ORIGIN/.well-known/mdbase-app.json does not declare $ORIGIN/"
          exit 1

  native-dispatch:
    # No environment, credentials, checkout or caller-supplied executable code.
    if: inputs.source_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require literal native release branch and exact publication HEAD
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in staging|production) ;; *) exit 1 ;; esac
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/release/native-$TARGET" ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]

  native-deploy:
    name: Protected native Writer to ${{ inputs.target }}
    needs: native-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: deploy-writer-${{ inputs.target }}
      cancel-in-progress: false
    # Existing environments: production MUST retain a required reviewer,
    # prevent-self-review, no admin bypass, and exact native branch policies.
    # This workflow neither creates protections nor supplies an approval bypass.
    environment:
      name: writer-${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://writer.mdbase.dev/' || 'https://staging.mdbase-writer.pages.dev/' }}
    env:
      TARGET: ${{ inputs.target }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Verify clean exact source and independently approved target SDK originals
        env:
          # Public digest approved independently AFTER canonical producer auth.
          # Missing archives or protected digest is a hard pre-upload refusal.
          WRITER_NATIVE_TRUST_SHA256: ${{ vars.WRITER_NATIVE_TRUST_SHA256 }}
        run: |
          set -euo pipefail
          export RECEIPTS="$RUNNER_TEMP/writer-native-receipt"
          echo "RECEIPTS=$RECEIPTS" >> "$GITHUB_ENV"
          mkdir -p "$RECEIPTS"
          node apps/writer/scripts/native-publisher.mjs guard --target "$TARGET" --sha "$SOURCE_SHA" --repo-root . > "$RECEIPTS/plan.json"
      - run: pnpm install --frozen-lockfile
      - name: Test qualified source (no deployment credentials)
        run: pnpm check
      - name: Build once with exact target origins; strict canonical manifest validation
        run: |
          set -euo pipefail
          # Install/test scripts must not have changed source or archive inputs.
          node apps/writer/scripts/native-publisher.mjs guard --target "$TARGET" --sha "$SOURCE_SHA" --repo-root . > "$RECEIPTS/plan-confirmed.json"
          cmp "$RECEIPTS/plan.json" "$RECEIPTS/plan-confirmed.json"
          MDBASE_WRITER_ORIGIN=$(jq -er .origin "$RECEIPTS/plan.json")
          VITE_MDBASE_CONNECT_URL=$(jq -er .sdkTrust.release.cpOrigin "$RECEIPTS/plan.json")
          VITE_MDBASE_EDITOR_URL=$(jq -er .sdkTrust.editorOrigin "$RECEIPTS/plan.json")
          export MDBASE_WRITER_ORIGIN VITE_MDBASE_CONNECT_URL VITE_MDBASE_EDITOR_URL
          export VITE_MDBASE_ENV="$TARGET"
          export VITE_MDBASE_CONNECT_LOOPBACK_URL=''
          export VITE_WRITER_DEMO=0
          export VITE_MDBASE_WRITER_BUILD_ID="$SOURCE_SHA"
          pnpm build
          node apps/writer/scripts/validate-manifest.mjs apps/writer/dist/.well-known/mdbase-app.json
          node apps/writer/scripts/native-publisher.mjs inventory --dist apps/writer/dist --plan "$RECEIPTS/plan.json" > "$RECEIPTS/inventory.json"
        env:
          WRITER_NATIVE_TRUST_SHA256: ${{ vars.WRITER_NATIVE_TRUST_SHA256 }}
          VITE_MDBASE_FEEDBACK_URL: ${{ vars.MDBASE_FEEDBACK_URL }}
          VITE_MDBASE_FEEDBACK_TURNSTILE_SITE_KEY: ${{ vars.MDBASE_FEEDBACK_TURNSTILE_SITE_KEY }}
      - name: Upload the already-built bytes once
        id: upload
        working-directory: apps/writer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          branch=$(jq -er .pagesBranch "$RECEIPTS/plan.json")
          # Pages branch main is a channel, NEVER a Git main checkout/merge.
          pnpm dlx wrangler@4.120.0 pages deploy dist --project-name mdbase-writer --branch "$branch" --commit-hash "$SOURCE_SHA" --commit-dirty=false 2>&1 | tee "$RECEIPTS/wrangler-output.txt"
      - name: Resolve actual deployment UUID bound to uploaded URL, commit and channel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node apps/writer/scripts/native-publisher.mjs capture-deployment --target "$TARGET" --sha "$SOURCE_SHA" --wrangler-output "$RECEIPTS/wrangler-output.txt" > "$RECEIPTS/deployment.json"
      - name: Verify real staging alias or production custom domain against saved digests
        if: always() && steps.upload.outcome == 'success'
        run: |
          set -euo pipefail
          origin=$(jq -er .origin "$RECEIPTS/plan.json")
          node apps/writer/scripts/verify-served.mjs --origin "$origin" --inventory "$RECEIPTS/inventory.json" > "$RECEIPTS/verification.json"
      - name: Record receipt (missing ID or served-byte failure is NOT success)
        if: always() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure')
        run: |
          node apps/writer/scripts/native-publisher.mjs receipt --target "$TARGET" --plan "$RECEIPTS/plan.json" --inventory "$RECEIPTS/inventory.json" --deployment "$RECEIPTS/deployment.json" --verification "$RECEIPTS/verification.json" > "$RECEIPTS/receipt.json"
      - name: Retain evidence even on failure; never rollback or redeploy
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: writer-native-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writer-native-receipt/
          if-no-files-found: warn
          retention-days: 90
