<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 16 16"
  role="img"
  aria-labelledby="mdbase-favicon-title"
>
  <title id="mdbase-favicon-title">mdbase writer</title>
  <style>
    .bars { fill: #d55e00; }
    .line { fill: #131921; }
    @media (prefers-color-scheme: dark) {
      .bars { fill: #f58d4a; }
      .line { fill: #e1e5ea; }
    }
  </style>
  <g class="bars">
    <rect x="1" y="1" width="4" height="2"/>
    <rect x="6" y="1" width="4" height="2"/>
    <rect x="11" y="1" width="4" height="2"/>
    <rect x="1" y="5" width="2" height="2"/>
    <rect x="1" y="9" width="5" height="2"/>
    <rect x="7" y="9" width="8" height="2"/>
    <rect x="1" y="13" width="4" height="2"/>
    <rect x="6" y="13" width="4" height="2"/>
    <rect x="11" y="13" width="4" height="2"/>
  </g>
  <rect class="line" x="4" y="5" width="11" height="2"/>
</svg>
